services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:?set WIREGUARD_PRIVATE_KEY in .env}
      - VPN_PORT_FORWARDING=on
      # Only pick ProtonVPN servers that support P2P / port forwarding.
      - PORT_FORWARD_ONLY=on
      # Push the forwarded port to qBittorrent (needs "bypass auth for localhost" in qBittorrent).
      # The DOWN command resets the port so qBittorrent re-binds after a reconnect.
      # UP retries ~10 min: covers qbittorrent being restarted by autoheal after a gluetun restart.
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- -nv --retry-connrefused --tries=60 --waitretry=10 --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences'
      - VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8080/api/v2/app/setPreferences'
      - TZ=${TZ:-Pacific/Auckland}
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    labels:
      # Recreating gluetun breaks qbittorrent's network namespace, so never auto-update it.
      # Update manually: docker compose pull gluetun && docker compose up -d gluetun qbittorrent
      - com.centurylinklabs.watchtower.enable=false
    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM:-}
    volumes:
      - ./config/plex:/config
      - ${DATA_ROOT:-/data}/media/movies:/data/movies:ro
      - ${DATA_ROOT:-/data}/media/tv:/data/tv:ro
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - ./config/radarr:/config
      - ${DATA_ROOT:-/data}:/data
    ports:
      - "7878:7878"
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - ./config/sonarr:/config
      - ${DATA_ROOT:-/data}:/data
    ports:
      - "8989:8989"
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: service:gluetun
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Pacific/Auckland}
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      - ${DATA_ROOT:-/data}/downloads:/data/downloads
    # Unhealthy when it has no egress through the VPN (e.g. gluetun restarted and the
    # shared network namespace is gone). autoheal then restarts it to re-join gluetun.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "10", "-o", "/dev/null", "https://cloudflare.com/cdn-cgi/trace"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - ./config/bazarr:/config
      - ${DATA_ROOT:-/data}/media/movies:/movies
      - ${DATA_ROOT:-/data}/media/tv:/tv
    ports:
      - "6767:6767"
    restart: unless-stopped

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - ./config/tautulli:/config
    ports:
      - "8181:8181"
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
    ports:
      - "8191:8191"
    restart: unless-stopped

  unpackerr:
    image: ghcr.io/unpackerr/unpackerr:latest
    container_name: unpackerr
    # Run as the same user as Radarr/Sonarr so extracted files stay manageable by them.
    user: "1000:1000"
    environment:
      - TZ=${TZ:-Pacific/Auckland}
    volumes:
      - ./config/unpackerr:/config
      # Same container path as Radarr/Sonarr/qBittorrent (unpackerr.conf uses /data/downloads).
      - ${DATA_ROOT:-/data}/downloads:/data/downloads
    ports:
      - "5757:5757"
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Pacific/Auckland}
      # homepage:3000 = Uptime Kuma monitor (internal Docker network)
      - HOMEPAGE_ALLOWED_HOSTS=pi-tylos,pi-tylos.local,192.168.1.17,localhost,homepage:3000
      - DOCKER_HOST=unix:///var/run/docker.sock
      # Widget API keys come from .env (referenced as {{HOMEPAGE_VAR_*}} in services.yaml)
      - HOMEPAGE_VAR_RADARR_KEY=${RADARR_API_KEY:?set RADARR_API_KEY in .env}
      - HOMEPAGE_VAR_SONARR_KEY=${SONARR_API_KEY:?set SONARR_API_KEY in .env}
    volumes:
      - ./config/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    user: 1000:985   # 985 = docker group on the host (read docker.sock)
    ports:
      - "80:3000"
    restart: unless-stopped

  glances:
    image: nicolargo/glances:latest
    container_name: glances
    pid: host
    environment:
      - GLANCES_OPT=-w
      - TZ=${TZ:-Pacific/Auckland}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "61208:61208"
    restart: unless-stopped


  overseerr:
    image: sctx/overseerr:latest
    container_name: overseerr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Pacific/Auckland}
    volumes:
      - ./config/overseerr:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    volumes:
      - ./config/uptime-kuma:/app/data
    ports:
      - "3001:3001"
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    environment:
      - TZ=${TZ:-Pacific/Auckland}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 3 * * *
      - DOCKER_API_VERSION=1.47
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Restarts containers labeled autoheal=true when they become unhealthy.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    network_mode: none   # only talks to the Docker socket
    environment:
      - TZ=${TZ:-Pacific/Auckland}
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=300
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
