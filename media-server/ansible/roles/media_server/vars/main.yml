# ── Data paths ──
data_root: /mnt/ai-data/data
media_movies: "{{ data_root }}/media/movies"
media_tv: "{{ data_root }}/media/tv"
downloads: "{{ data_root }}/downloads"

# ── Service config ──
media_server_dir: "/home/{{ ansible_user }}/media-server"
timezone: "Pacific/Auckland"

# ── Bot config (non-secret) ──
telegram_admin_id: "836031672"
telegram_extra_users: ""   # optional, comma-separated user IDs (prefer /adduser from chat)
qbittorrent_user: "admin"

# ── Secrets: values live in vault.yml (ansible-vault encrypted) ──
radarr_api_key: "{{ vault_radarr_api_key }}"
sonarr_api_key: "{{ vault_sonarr_api_key }}"
telegram_bot_token: "{{ vault_telegram_bot_token }}"
tmdb_api_key: "{{ vault_tmdb_api_key }}"
qbittorrent_pass: "{{ vault_qbittorrent_pass }}"
plex_claim: "{{ vault_plex_claim | default('') }}"
wireguard_private_key: "{{ vault_wireguard_private_key }}"
