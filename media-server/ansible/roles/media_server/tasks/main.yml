---
- name: Create data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  become: true
  loop:
    - "{{ media_movies }}"
    - "{{ media_tv }}"
    - "{{ downloads }}"

- name: Create media-server project directory
  ansible.builtin.file:
    path: "{{ media_server_dir }}"
    state: directory

- name: Create config subdirectories
  ansible.builtin.file:
    path: "{{ media_server_dir }}/config/{{ item }}"
    state: directory
  loop:
    - plex
    - radarr
    - sonarr
    - qbittorrent
    - prowlarr

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ media_server_dir }}/docker-compose.yml"

- name: Deploy .env file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ media_server_dir }}/.env"

- name: Start docker compose stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ media_server_dir }}"
  environment:
    DATA_ROOT: "{{ data_root }}"
  register: compose_result
  changed_when: "'Started' in compose_result.stdout or 'Creating' in compose_result.stdout"

- name: Wait for Radarr to be ready
  ansible.builtin.uri:
    url: "http://localhost:7878/api/v3/system/status"
    headers:
      X-Api-Key: "{{ radarr_api_key }}"
  register: radarr_status
  until: radarr_status.status == 200
  retries: 30
  delay: 5

- name: Wait for Sonarr to be ready
  ansible.builtin.uri:
    url: "http://localhost:8989/api/v3/system/status"
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
  register: sonarr_status
  until: sonarr_status.status == 200
  retries: 30
  delay: 5

- name: Configure Radarr root folder
  ansible.builtin.uri:
    url: "http://localhost:7878/api/v3/rootfolder"
    method: POST
    headers:
      X-Api-Key: "{{ radarr_api_key }}"
    body_format: json
    body:
      path: "/data/media/movies"
  ignore_errors: true

- name: Configure Sonarr root folder
  ansible.builtin.uri:
    url: "http://localhost:8989/api/v3/rootfolder"
    method: POST
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
    body_format: json
    body:
      path: "/data/media/tv"
  ignore_errors: true

- name: Copy bot files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../bot/"
    dest: "{{ media_server_dir }}/bot/"

- name: Install bot Python dependencies
  ansible.builtin.pip:
    requirements: "{{ media_server_dir }}/bot/requirements.txt"
    virtualenv: "{{ media_server_dir }}/bot/venv"

- name: Deploy systemd service for bot
  ansible.builtin.template:
    src: cinebot.service.j2
    dest: "/etc/systemd/system/cinebot.service"
  become: true
  notify: restart cinebot

- name: Enable cinebot service
  ansible.builtin.systemd:
    name: cinebot
    enabled: true
    daemon_reload: true
  become: true

# Bot files deployed earlier in the playbook
