---
- name: Create data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    # mode intentionally not enforced: live movies/tv dirs are 0777 (TODO: audit and tighten)
  become: true
  loop:
    - "{{ media_movies }}"
    - "{{ media_tv }}"
    - "{{ downloads }}"

- name: Create media-server project directory
  ansible.builtin.file:
    path: "{{ media_server_dir }}"
    state: directory

- name: Create config subdirectories
  ansible.builtin.file:
    path: "{{ media_server_dir }}/config/{{ item }}"
    state: directory
  loop:
    - plex
    - radarr
    - sonarr
    - qbittorrent
    - prowlarr

# Single source of truth: the repo's media-server/docker-compose.yml (secrets come from .env).
- name: Deploy docker-compose.yml
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docker-compose.yml"
    dest: "{{ media_server_dir }}/docker-compose.yml"
    mode: "0644"

- name: Deploy .env file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ media_server_dir }}/.env"
    mode: "0600"

- name: Start docker compose stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ media_server_dir }}"
  environment:
    DATA_ROOT: "{{ data_root }}"
  register: compose_result
  changed_when: "'Started' in compose_result.stdout or 'Creating' in compose_result.stdout"

- name: Wait for Radarr to be ready
  ansible.builtin.uri:
    url: "http://localhost:7878/api/v3/system/status"
    headers:
      X-Api-Key: "{{ radarr_api_key }}"
  register: radarr_status
  until: radarr_status.status == 200
  retries: 30
  delay: 5

- name: Wait for Sonarr to be ready
  ansible.builtin.uri:
    url: "http://localhost:8989/api/v3/system/status"
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
  register: sonarr_status
  until: sonarr_status.status == 200
  retries: 30
  delay: 5

# Root folders: query first, create only if missing (idempotent).
- name: Get Radarr root folders
  ansible.builtin.uri:
    url: "http://localhost:7878/api/v3/rootfolder"
    headers:
      X-Api-Key: "{{ radarr_api_key }}"
  register: radarr_roots
  check_mode: false

- name: Configure Radarr root folder
  ansible.builtin.uri:
    url: "http://localhost:7878/api/v3/rootfolder"
    method: POST
    headers:
      X-Api-Key: "{{ radarr_api_key }}"
    body_format: json
    body:
      path: "/data/media/movies"
    status_code: [200, 201]
  when: "'/data/media/movies' not in (radarr_roots.json | map(attribute='path') | list)"
  changed_when: true

- name: Get Sonarr root folders
  ansible.builtin.uri:
    url: "http://localhost:8989/api/v3/rootfolder"
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
  register: sonarr_roots
  check_mode: false

- name: Configure Sonarr root folder
  ansible.builtin.uri:
    url: "http://localhost:8989/api/v3/rootfolder"
    method: POST
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
    body_format: json
    body:
      path: "/data/media/tv"
    status_code: [200, 201]
  when: "'/data/media/tv' not in (sonarr_roots.json | map(attribute='path') | list)"
  changed_when: true

- name: Copy bot files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../bot/"
    dest: "{{ media_server_dir }}/bot/"

- name: Install system packages required by the pip module
  ansible.builtin.apt:
    name:
      - python3-packaging
      - python3-venv
    state: present
  become: true

- name: Install bot Python dependencies
  ansible.builtin.pip:
    requirements: "{{ media_server_dir }}/bot/requirements.txt"
    virtualenv: "{{ media_server_dir }}/bot/venv"

- name: Deploy systemd service for bot
  ansible.builtin.template:
    src: cinebot.service.j2
    dest: "/etc/systemd/system/cinebot.service"
  become: true
  notify: restart cinebot

- name: Enable cinebot service
  ansible.builtin.systemd:
    name: cinebot
    enabled: true
    daemon_reload: true
  become: true

# Bot files deployed earlier in the playbook
